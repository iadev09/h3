[package]
name = "h3-webtransport-forked"
version.workspace = true
edition = "2021"
documentation = "https://docs.rs/h3-webtransport-forked"
repository = "https://github.com/iadev09/h3"
readme = "readme.md"
description = "WebTransport extension for h3-forked."
keywords = ["http3", "quic", "webtransport"]
categories = ["network-programming", "web-programming"]
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "h3_webtransport"

[dependencies]
bytes = "1"
futures-util = { version = "0.3", default-features = false }
http = "1"
pin-project-lite = { version = "0.2", default-features = false }
tracing = "0.1.37"
tokio = { version = "1.28", default-features = false }
h3-datagram = { package = "h3-datagram-forked", version = "0.0.2", path = "../h3-datagram" }

[dependencies.h3]
package = "h3-forked"
version = "0.0.2"
path = "../h3"
features = ["i-implement-a-third-party-backend-and-opt-into-breaking-changes"]

[dev-dependencies]
h3-quinn = { package = "h3-quinn-forked", version = "0.0.2", path = "../h3-quinn", features = ["datagram"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["rt", "macros", "io-util"] }
