[package]
name = "h3-datagram-forked"
version.workspace = true
edition = "2021"
documentation = "https://docs.rs/h3-datagram-forked"
repository = "https://github.com/iadev09/h3"
readme = "readme.md"
description = "HTTP Datagram extension for h3-forked."
keywords = ["http3", "quic", "rfc9297"]
categories = ["network-programming", "web-programming"]
license = "MIT"


[lib]
name = "h3_datagram"

[dependencies]
bytes = "1.4"
tracing = { version = "0.1.40", optional = true }

[features]
tracing = ["dep:tracing"]

[dependencies.h3]
package = "h3-forked"
version = "0.0.1"
path = "../h3"
features = ["i-implement-a-third-party-backend-and-opt-into-breaking-changes"]
